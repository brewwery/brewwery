name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BREWWERY_LIVE: "0"
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Isolated core, app and rendering tests
        run: swift test --skip BrewweryLiveTests
      - name: Appcast metadata and signature regression checks
        run: swift Scripts/test-appcast.swift "$PWD/Scripts/verify-appcast.swift"
      - name: Universal bundle and headless verification
        run: bash Scripts/make-app.sh
      - name: Archive local QA bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/Brewwery.app dist/Brewwery-QA.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Brewwery-local-QA-not-notarized
          path: dist/Brewwery-QA.zip
          if-no-files-found: error
          retention-days: 7
